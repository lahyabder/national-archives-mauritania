<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة طلب تحويل أرشيف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--c-parchment); }
        .form-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: var(--shadow-float); border-top: 5px solid var(--c-green-main); }
        .form-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--c-border); padding-bottom: 20px; }
        .form-header h2 { font-family: var(--f-serif); color: var(--c-green-dark); }
        .form-header p { color: var(--c-text-light); }
        .form-section { margin-bottom: 30px; }
        .form-section h3 { font-family: var(--f-ui); color: var(--c-gold); border-bottom: 1px dashed var(--c-border); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; color: var(--c-text-main); }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border: 1px solid var(--c-border); border-radius: 4px; font-family: var(--f-sans); font-size: 1rem; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--c-green-main); }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo.jpg" alt="Logo" class="brand-logo">
                <div class="brand-text">
                    <h1>المندوبية العامة للوثائق الوطنية</h1>
                    <span class="brand-subtitle">الجمهورية الإسلامية الموريتانية</span>
                </div>
            </a>
            <div class="nav-actions">
                <a href="agencies.html" class="btn-outline-gold"><i class="fas fa-arrow-right"></i> العودة لصفحة الجهات</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <div class="form-header">
                <h2>استمارة طلب تحويل أرشيف إداري</h2>
                <p>وفقاً لمقتضيات المرسوم رقم 22.070 الخاص بدفع الأرشيف</p>
            </div>
            
            <form action="deposit-portal.html">
                <div class="form-section">
                    <h3>1. بيانات الجهة المحولة (الجهة المودعة)</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>الوزارة / المؤسسة العمومية</label>
                            <input type="text" placeholder="مثال: وزارة التعليم العالي..." required>
                        </div>
                        <div class="form-group">
                            <label>الإدارة / المصلحة</label>
                            <input type="text" placeholder="مثال: إدارة المصادر البشرية..." required>
                        </div>
                        <div class="form-group">
                            <label>اسم المسؤول المباشر (نقطة الاتصال)</label>
                            <input type="text" required>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="tel" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>2. تفاصيل الأرشيف المحول</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>نوع الأرشيف</label>
                            <select required>
                                <option>أرشيف وسيط (5 - 10 سنوات)</option>
                                <option>أرشيف تاريخي (أكثر من 10 سنوات)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>الفترة الزمنية للوثائق (من - إلى)</label>
                            <input type="text" placeholder="مثال: 2010 - 2015" required>
                        </div>
                        <div class="form-group">
                            <label>عدد العلب الأرشيفية / المجلدات</label>
                            <input type="number" min="1" required>
                        </div>
                        <div class="form-group">
                            <label>الحجم التقديري (بالمتر الطولي)</label>
                            <input type="text" placeholder="مثال: 5 أمتار">
                        </div>
                        <div class="form-group full-width">
                            <label>وصف عام لمحتوى الوثائق</label>
                            <textarea rows="4" placeholder="يرجى كتابة وصف مختصر لطبيعة الملفات (ملفات موظفين، صفقات عمومية، مراسلات...)" required></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>3. المرفقات المطلوبة</h3>
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>إرفاق جدول مفصل بمحتويات العلب (Excel أو PDF)</label>
                            <input type="file" required style="padding: 10px; background: #f9f9f9;">
                        </div>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 40px;">
                    <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> إرسال الطلب واعتماد النقل</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Back Button -->
    <a href='javascript:history.back()' class='floating-back-btn' title='عودة / Back'>
        <i class='fas fa-arrow-right rtl-arrow'></i>
    </a>

</body>
</html>
